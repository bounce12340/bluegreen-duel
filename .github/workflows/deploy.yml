# 推到 main 就自動部署到 Cloudflare Pages。
# 需要在 repo 的 Settings → Secrets and variables → Actions 設定：
#   CLOUDFLARE_API_TOKEN（權限：Cloudflare Pages Edit、Workers Scripts Edit）
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 平衡模擬（勝率超出 40–60% 就停止部署）
        run: node tools/sim.mjs 1000 | tee sim.txt

      - name: 卡牌內容合規＋嘲諷對稱檢查（Jev）
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        # 任一合規規則機率 ≥ 0.7 就停止部署；0.3–0.7 只列在報告請人工確認；Jev 失敗只警告不擋
        run: node tools/content_check.mjs

      - name: 建立 Pages 專案（已存在則略過）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create bluegreen-duel --production-branch main || true

      - name: 部署連線伺服器（Worker + Durable Objects）
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: 寫入 Jev 金鑰（repo secret 有設 TYPESAFE_API_KEY 才寫）
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -n "$TYPESAFE_API_KEY" ]; then
            printf '%s' "$TYPESAFE_API_KEY" | npx --yes wrangler@4 secret put TYPESAFE_API_KEY
          else
            echo "repo secret TYPESAFE_API_KEY 沒有設定，略過"
          fi

      - name: 寫入信箱分流設定（repo secret 有設才寫）
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          for name in AGENTMAIL_API_KEY NOTIFY_EMAIL; do
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | npx --yes wrangler@4 secret put "$name"; else echo "repo secret $name 沒有設定，略過"; fi
          done

      - name: 部署網站（Pages + /api 轉接）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy --project-name bluegreen-duel --branch main --commit-dirty=true
