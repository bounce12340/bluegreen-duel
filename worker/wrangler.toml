# 連線對戰伺服器（只透過 Pages 的 /api 轉進來，不開公開網址）
name = "bluegreen-duel-server"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
# 保留在 Cloudflare 後台設定的變數（MAINTENANCE、DISABLED_CARDS、TURNSTILE_SITE_KEY），部署時不覆蓋
keep_vars = true

[vars]
ALLOWED_HOSTS = "bluegreen-duel.pages.dev"
# Jev（TypeSafe）：作者已同意啟用（2026-10-27）。金鑰 TYPESAFE_API_KEY 由 GitHub Actions 從 repo secret 寫入。
# 緊急關閉：Cloudflare 後台 → bluegreen-duel-server → Settings → Variables 加 JEV_DISABLED = 1（部署不會蓋掉）
# 每日上限 JEV_DAILY_CAP、每 IP 每分鐘上限 JEV_PER_IP_PER_MIN 也可在後台設定（預設 50000、20）
JEV_ENABLED = "1"
MAIL_INBOX = "bluegreen-duel@agentmail.to"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "JEV_GATE"
class_name = "JevGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JevGate"]

# 每 5 分鐘檢查一次聯絡信箱（需 AGENTMAIL_API_KEY、NOTIFY_EMAIL）
[triggers]
crons = ["*/5 * * * *", "0 13 * * *"] # 信箱分流；每日彙整（台北 21:00）

[observability]
enabled = true
